# Builds the web image, runs the database migrations and deploys to ECS. docs/DEPLOY.md
# describes what it deploys to; Terraform (infra/) is applied by hand, never from here.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/contracts/**
      - design-system/fonts/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .dockerignore
      - .github/workflows/deploy.yml
      - infra/deploy.sh
  # Redeploys the chosen ref as it is: after a Terraform change, or after filling in a secret.
  workflow_dispatch:

# One deploy at a time. A second push waits for the first to finish rather than racing it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # to exchange GitHub's OIDC token for AWS credentials; no AWS keys are stored

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  # The name infra/ gives the image repository. infra/deploy.sh holds the other resource names.
  ECR_REPOSITORY: triagecam-prod-web

jobs:
  deploy:
    name: Build, migrate, deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Actions are pinned to commits, not to tags that can be moved: this job can assume the
      # deploy role. Update a pin by looking up the commit of the new version's tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The repository is public, and so are these logs: the account id is masked in them.
      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Sign in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Tags are immutable and one commit is one image, so a re-run reuses what is there.
      - name: Look for this commit's image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          echo "uri=$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$GITHUB_SHA" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "The image for $GITHUB_SHA is already in ECR; not building it again."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.image.outputs.exists == 'false'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push the image
        if: steps.image.outputs.exists == 'false'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.uri }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Registers the task definition (Terraform's template with this image), runs the database
      # migrations from it, moves the service to it and follows the blue/green deployment. The
      # same script deploys by hand when Actions is not available (docs/DEPLOY.md).
      - name: Migrate and deploy
        run: infra/deploy.sh "$GITHUB_SHA"
